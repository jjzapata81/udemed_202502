<section id="profile">
  <div>
    <img [src]="user.url" />
    <span id="userName">{{user.name||user.username}}</span>
  </div>
  <div>
    <span>
      {{galleryItems().length}}
    </span>
    <span>Publicaciones</span>
  </div>
  <div>
    <span>{{followers}}</span>
    <span>Seguidores</span>
  </div>
  <div>
    <span>{{requests}}</span>
    <span>Solicitudes</span>
  </div>
</section>
<section id="gallery">

  @if(galleryItems().length>0){

    @for(image of galleryItems(); track image){
      <app-image [gallery-item]="image" (addComment)="onSendComment($event)"/>
    } 
  }@else{
    <span>Aún no has cargado imágenes</span>
  }
  
</section>
