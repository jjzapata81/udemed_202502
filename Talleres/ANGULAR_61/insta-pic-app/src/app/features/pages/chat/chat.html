<section class="chat-container">
  <h2>Chat con {{ userTo.username }}</h2>
  <div class="chat-messages">
    @for(msg of chatService.messages(); track msg){
    <div
      [class]="
        msg['sender_id'] === user!.id
          ? 'message my-message'
          : 'message their-message'
      "
    >
      {{ msg["content"] }}
    </div>
    }
  </div>
  <form (submit)="sendMessage()" class="chat-form" [formGroup]="chatForm">
    <input
      type="text"
      formControlName="message"
      name="message"
      class="chat-input"
      placeholder="Escribe tu mensaje"
    />
    <button type="submit" class="chat-button">Enviar</button>
  </form>
</section>
